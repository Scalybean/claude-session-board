/* Design rules — process table:
   - One table, one row per session, sorted by what needs you. No cards, no panels, no chips.
   - One highlight: amber means "blocked on you". Nothing else is amber.
   - State is a glyph plus a word in its own column. Secondary facts are a muted second line.
   - Actions live in the footer and on the keyboard, for the selected row only. */
:root{
  --bg:#f4f5f7; --ink:#1f2530; --muted:#6b7483; --line:#dde1e7; --sel:#e6ebf3;
  --hot:#f2b134; --hot-ink:#1d2330; --hot-sub:#5a4512;
  --work:#2f5fc4; --turn:#2d8048; --err:#c0392b;
  --mono:"CSB Mono",Consolas,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1d2330; --ink:#d9dee8; --muted:#7e8899; --line:#2c3443; --sel:#273041;
  --hot:#f2b134; --hot-ink:#1d2330; --hot-sub:#4a3a12;
  --work:#8fb3ff; --turn:#8fd19e; --err:#ff8a7a;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.45;padding:24px 28px 40px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--work);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;margin-bottom:14px;color:var(--muted)}
.top h1{font-size:14px;font-weight:400;margin:0;color:var(--muted)}
.top b{color:var(--ink);font-weight:700}
.top .hot b{color:var(--hot)}
.top .off{color:var(--err)}
.top .push{margin-left:auto}

.msg{color:var(--muted);padding:10px 0 14px}
.msg code{color:var(--ink)}

table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-weight:400;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;vertical-align:top;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.s{white-space:normal;overflow-wrap:anywhere}
.c-st{width:150px}.c-pr{width:200px}.c-age{width:72px;text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:default}
tbody tr.sel td{background:var(--sel)}
tr.hot td{background:var(--hot);color:var(--hot-ink);border-bottom-color:var(--bg)}
tr.hot.sel td{background:var(--hot);box-shadow:inset 0 2px 0 var(--hot-ink),inset 0 -2px 0 var(--hot-ink)}
tr.hot .sub{color:var(--hot-sub)}
.st-working{color:var(--work)} .st-turn{color:var(--turn)} .st-err{color:var(--err)} .st-ended{color:var(--muted)}
.sub{color:var(--muted);display:block;margin-top:2px}
.dim{opacity:.6}
.wsl{opacity:.7}
.empty td{color:var(--muted);text-align:center;padding:28px 10px}
tr.group td{color:var(--muted);padding-top:18px;border-bottom:1px solid var(--line);cursor:pointer}
/* live progress under working sessions: the task list (when the session keeps one), then the latest steps */
tr.haspro td{border-bottom:0}
tr.prog td{padding-top:0;padding-bottom:12px;white-space:normal;overflow:visible}
tr.hot.haspro + tr.prog td{background:var(--hot);color:var(--hot-ink)}
tr.hot.haspro + tr.prog .steps li,tr.hot.haspro + tr.prog .latest{color:var(--hot-sub)}
tr.hot.haspro + tr.prog .steps li.now,tr.hot.haspro + tr.prog .g{color:var(--hot-ink)}
.steps{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:1px}
.steps li{display:grid;grid-template-columns:18px minmax(0,1fr);color:var(--muted)}
.steps li.done .g{color:var(--turn)}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now .g{color:var(--work)}
.steps li.more{display:block;padding-left:18px}
.latest{display:grid;grid-template-columns:18px minmax(0,1fr);color:var(--muted);margin-top:6px}
.latest .g{color:var(--work)}
.count{color:var(--work)}
td.pr .conv{white-space:normal}

.foot{margin-top:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.foot kbd{font-family:inherit;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--ink);color:var(--bg);padding:7px 14px}

.projline{display:none;color:var(--muted)}
tr.hot .projline{color:var(--hot-sub)}
@media (max-width:640px){
  body{padding:16px}
  thead{display:none}
  table,tbody{display:block}
  tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid var(--line)}
  td{border-bottom:0}
  td.pr{display:none}
  td.s{grid-column:1 / -1;padding-top:0}
  td.c-age{grid-row:1;grid-column:2}
  tr.group td,.empty td{grid-column:1 / -1}
  tr.hot{background:var(--hot);border-bottom-color:var(--bg)}
  tr.prog td:first-child{display:none}
  tr.prog td:last-child{grid-column:1 / -1}
  tr.haspro{border-bottom:0}
  .projline{display:block}
}
</style>
</head>
<body>
<div class="top" id="top"></div>
<div class="msg" id="msg" hidden></div>
<table>
  <thead><tr><th class="c-st">STATE</th><th class="c-pr">PROJECT</th><th>SESSION / NOW</th><th class="c-age">AGE</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="foot" id="foot"></div>
<div class="toast" id="toast" hidden></div>

<script>
const QUIET_MIN = 15;    // working but silent this long → say so
const STALE_MIN = 30;    // quiet this much longer than the oldest working session → fold into the collapsed group

let pageAt0 = null;
let data = null, lastLoadOk = 0, selected = null, showEnded = false, prevNeeds = new Set(), notifyOn = false;
let hidden = {};
try { hidden = JSON.parse(localStorage.getItem("csb-hidden") || "{}"); } catch {}
try { notifyOn = localStorage.getItem("csb-notify") === "1"; } catch {}
try { showEnded = localStorage.getItem("csb-ended") === "1"; } catch {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const base = p => String(p||"").replace(/[\\/]+$/,"").split(/[\\/]/).pop() || p || "?";
function dur(ms){
  const s = Math.max(0, Math.floor(ms/1000)); if (s < 60) return s + "s";
  const m = Math.floor(s/60); if (m < 60) return m + "m";
  const h = Math.floor(m/60); if (h < 24) return h + "h" + (m%60 ? String(m%60).padStart(2,"0") : "");
  return Math.floor(h/24) + "d";
}
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,1500); }
async function copy(text, label){
  if (!text) return;
  try { await navigator.clipboard.writeText(text); toast(label + " copied"); }
  catch { prompt("Copy this:", text); }
}

function bucket(s, now){
  if (s.state === "ended") return "ended";
  if (s.state === "needs") return "needs";
  if (s.state === "working") return "working";
  return "turn";
}
function stateCell(s, b, now){
  if (b === "needs") return /^Permission/.test(s.detail||"") ? "? permission" : "? question";
  if (b === "working") return `<span class="st-working">● working</span>`;
  if (b === "ended") return s.state === "ended" ? `<span class="st-ended">– exited</span>` : `<span class="st-ended">– idle</span>`;
  if (s.state === "error") return `<span class="st-err">✗ error</span>`;
  if (s.state === "ready") return `<span class="st-turn">○ new</span>`;
  return `<span class="st-turn">✓ your turn</span>`;
}
function subLine(s, b, now){
  if (b === "needs"){
    const d = s.detail || "Waiting for your answer";
    return /^Permission to run: /.test(d) ? "$ " + d.replace(/^Permission to run: /,"") : d.replace(/^Permission to use /,"use ");
  }
  if (b === "working"){
    const quiet = now - (s.lastEventAt||0) > QUIET_MIN*60000;
    return (s.detail || "thinking") + (quiet ? " · silent " + dur(now - s.lastEventAt) : "");
  }
  if (b === "turn") return s.lastReply || s.detail || "";
  return s.detail || "";
}

let ordered = [];
function render(){
  const now = Date.now();
  const all = (data && data.sessions) || [];
  const g = {needs:[], working:[], turn:[], ended:[]};
  let hiddenCount = 0;
  // a session that went quiet 30+ minutes before the oldest working session last did something is folded away;
  // measured against working sessions, not the clock, so nothing folds while nothing is running
  const workAt = all.filter(s=>s.state==="working").map(s=>s.lastEventAt||0);
  // nothing working: measure against the most recently active session instead
  const liveAt = all.filter(s=>s.state!=="ended").map(s=>s.lastEventAt||0);
  const ref = workAt.length ? Math.min(...workAt) : (liveAt.length ? Math.max(...liveAt) : null);
  for (const s of all){
    let b = bucket(s, now);
    if (b === "turn" && ref !== null && (s.lastEventAt||0) < ref - STALE_MIN*60000) b = "ended";
    if ((b === "turn" || b === "ended") && hidden[s.id] === (s.t||0)) { hiddenCount++; continue; }
    g[b].push(s);
  }
  const bySince = (a,b)=>(a.stateSince||0)-(b.stateSince||0);
  g.needs.sort(bySince); g.working.sort(bySince);
  g.turn.sort((a,b)=>(b.stateSince||0)-(a.stateSince||0));
  g.ended.sort((a,b)=>(b.endedAt||b.lastEventAt||0)-(a.endedAt||a.lastEventAt||0));

  ordered = [...g.needs.map(s=>[s,"needs"]), ...g.working.map(s=>[s,"working"]), ...g.turn.map(s=>[s,"turn"]), ...(showEnded ? g.ended.map(s=>[s,"ended"]) : [])];
  if (selected && !ordered.some(([s])=>s.id===selected)) selected = null;

  const row = ([s,b]) => {
    const chat = s.surface === "chat";
    const folder = chat ? "desktop chat" : base(s.cwd), wsl = !chat && String(s.cwd||"").startsWith("/");
    const topic = s.topic && !String(s.topic).startsWith("/") ? s.topic : "";   // a bare slash command says little about the task
    const title = s.name || topic || s.aiTitle || s.topic || s.firstPrompt || folder;
    const tasks = Array.isArray(s.tasks) ? s.tasks : [];
    const showProg = selected === s.id && tasks.length > 0;   // the step list opens when you click the row, and closes on a second click
    const doneN = tasks.filter(x=>x.status==="completed").length;
    const nextT = tasks.find(x=>x.status!=="completed");
    const count = tasks.length ? `<span class="count">${doneN}/${tasks.length}</span> · ` : "";
    const curT = tasks.find(x=>x.status==="in_progress");
    const says = (Array.isArray(s.timeline) ? s.timeline : []).filter(x=>x.k==="say");
    const lastSay = says.length ? says[says.length-1].x : "";
    let sub = subLine(s,b,now);
    if (b === "turn" && tasks.length && nextT) sub = `next: ${nextT.subject}`;
    if (b === "working") sub = curT ? (curT.active || curT.subject) : (lastSay || sub);   // the step it's on, not the last command
    return `<tr data-id="${esc(s.id)}" class="${b==="needs"?"hot":""} ${b==="ended"?"dim":""} ${selected===s.id?"sel":""} ${showProg?"haspro":""}">
      <td>${stateCell(s,b,now)}</td>
      <td class="pr" title="${esc(s.cwd)}">${esc(folder)}${wsl?` <span class="wsl">[wsl]</span>`:""}${s.aiTitle && s.aiTitle !== title ? `<span class="sub conv"><bdi>${esc(s.aiTitle)}</bdi></span>` : ""}</td>
      <td class="s"><span class="projline">${esc(folder)}${wsl?" [wsl]":""}</span><bdi>${esc(title)}</bdi><span class="sub">${count}<bdi>${esc(sub)}</bdi></span></td>
      <td class="c-age" title="Time in this state">${dur(now - (s.stateSince||s.lastEventAt||now))}</td>
    </tr>${showProg ? progRow(s, tasks, b) : ""}`;
  };
  const hm = ms => { try { return new Date(ms).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", hour12:false}); } catch { return ""; } };
  function progRow(s, tasks, b){
    // the session's plan, step by step: a small check on finished steps, the current one highlighted
    let list = "";
    if (tasks.length){
      const cur = tasks.findIndex(x=>x.status==="in_progress");
      let from = 0, to = tasks.length;
      if (tasks.length > 20){ const p = cur >= 0 ? cur : tasks.findIndex(x=>x.status!=="completed"); from = Math.max(0, (p<0?tasks.length:p) - 6); to = Math.min(tasks.length, from + 18); }
      const li = x => {
        const done = x.status==="completed", now = x.status==="in_progress" && b === "working";
        const text = now && x.active ? x.active : x.subject;
        return `<li class="${done?"done":now?"now":""}"><span class="g">${done?"✓":now?"›":""}</span><bdi>${esc(text)}</bdi></li>`;
      };
      list = `<ol class="steps">${from>0?`<li class="more">${from} earlier step${from>1?"s":""}</li>`:""}${tasks.slice(from,to).map(li).join("")}${to<tasks.length?`<li class="more">${tasks.length-to} more</li>`:""}</ol>`;
    }
    // Claude's own latest update, one line, no commands
    const says = (Array.isArray(s.timeline) ? s.timeline : []).filter(x=>x.k==="say");
    const last = says.length ? says[says.length-1] : null;
    const shown = tasks.length ? (tasks.find(x=>x.status==="in_progress")||{}).active || "" : (last ? last.x : "");
    const latest = last && tasks.length && last.x !== s.detail && last.x !== shown ? `<div class="latest"><span class="g">·</span><bdi>${esc(last.x)}</bdi></div>` : "";
    if (!list && !latest) return "";
    return `<tr class="prog ${selected===s.id?"sel":""}" data-id="${esc(s.id)}"><td></td><td class="pr"></td><td colspan="2">${list}${latest}</td></tr>`;
  }
  let html = ordered.filter(([,b])=>b!=="ended").map(row).join("");
  if (!html && !g.ended.length) html = `<tr class="empty"><td colspan="4">${data ? "No Claude Code sessions running. Start one and it shows up here." : "Waiting for the first Claude Code event…"}</td></tr>`;
  if (g.ended.length){
    html += `<tr class="group" id="ended-toggle"><td colspan="4">${showEnded?"▾":"▸"} ${g.ended.length} exited or idle</td></tr>`;
    if (showEnded) html += ordered.filter(([,b])=>b==="ended").map(row).join("");
  }
  $("#rows").innerHTML = html;

  const n = g.needs.length, age = data ? now - (data.generatedAt||0) : 0;
  $("#top").innerHTML = `<h1>claude sessions</h1>
    <span class="${n?"hot":""}"><b>${n}</b> blocked</span><span><b>${g.working.length}</b> working</span><span><b>${g.turn.length}</b> your turn</span>
    <span class="${lastLoadOk?"":"off"}">${lastLoadOk ? (data && data.generatedAt ? "last event " + dur(age) + " ago" : "no events yet") : "can't read sessions.js"}</span>
    ${typeof Notification!=="undefined" ? `<button type="button" class="push" id="notify">${notifyOn && Notification.permission==="granted" ? "notifications on" : "notify me when blocked"}</button>` : ""}`;
  document.title = (n ? `(${n}) ` : "") + "Claude Sessions";

  const sel = ordered.find(([s])=>s.id===selected);
  $("#foot").innerHTML = (sel
    ? `<span><bdi>${esc(sel[0].surface==="chat" ? (sel[0].name||"desktop chat") : base(sel[0].cwd))}</bdi>:</span>
       ${sel[0].surface==="chat" ? "" : `<button type="button" data-do="resume"><kbd>c</kbd> copy resume command</button>
       <button type="button" data-do="folder"><kbd>f</kbd> copy folder</button>`}
       ${sel[1]==="turn"||sel[1]==="ended" ? `<button type="button" data-do="hide"><kbd>h</kbd> hide</button>` : ""}
       <span><kbd>esc</kbd> deselect</span>`
    : `<span><kbd>↑</kbd> <kbd>↓</kbd> or click a row to see its steps</span>`)
    + (hiddenCount ? `<button type="button" data-do="unhide">${hiddenCount} hidden · show</button>` : "");

  // notify on sessions that newly became blocked
  const nowNeeds = new Set(g.needs.map(s=>s.id+":"+s.stateSince));
  if (notifyOn && data && typeof Notification!=="undefined" && Notification.permission==="granted"){
    for (const s of g.needs) if (!prevNeeds.has(s.id+":"+s.stateSince)){
      try { new Notification("Blocked · " + (s.surface==="chat" ? (s.name||"desktop chat") : base(s.cwd)), {body: s.detail || "Waiting for your answer", tag: s.id}); } catch {}
    }
  }
  if (data) prevNeeds = nowNeeds;
}

function act(what){
  const sel = ordered.find(([s])=>s.id===selected);
  if (what === "unhide"){ hidden = {}; try{localStorage.removeItem("csb-hidden");}catch{} render(); return; }
  if (!sel) return;
  const s = sel[0];
  if (s.surface === "chat" && (what === "resume" || what === "folder")) return;
  if (what === "resume") copy(`claude --resume ${s.id}`, "Resume command");
  if (what === "folder") copy(s.cwd, "Folder path");
  if (what === "hide" && (sel[1]==="turn"||sel[1]==="ended")){
    hidden[s.id] = s.t||0; try{localStorage.setItem("csb-hidden",JSON.stringify(hidden));}catch{}
    selected = null; render(); toast("Hidden until it changes");
  }
}

/* poll sessions.js, which the hook writes next to this page */
function poll(){
  const sc = document.createElement("script");
  sc.src = "sessions.js?t=" + Date.now();
  sc.onload = () => {
    lastLoadOk = Date.now(); sc.remove();
    if (window.__CSB__) data = window.__CSB__;
    // reload when the dashboard file itself was updated
    if (data && data.pageAt){ if (pageAt0 === null) pageAt0 = data.pageAt; else if (data.pageAt !== pageAt0){ location.reload(); return; } }
    $("#msg").hidden = true; render();
  };
  sc.onerror = () => {
    sc.remove(); lastLoadOk = 0;
    const m = $("#msg"); m.hidden = false;
    m.innerHTML = `Can't read <code>sessions.js</code> next to this page. It appears after the first event from a Claude Code session started after the install.`;
    render();
  };
  document.head.appendChild(sc);
}
render(); poll(); setInterval(poll, 2000);

document.addEventListener("click", async e => {
  const d = e.target.closest("[data-do]"); if (d){ act(d.dataset.do); return; }
  if (e.target.closest("#ended-toggle")){ showEnded = !showEnded; try{localStorage.setItem("csb-ended",showEnded?"1":"0");}catch{} render(); return; }
  if (e.target.closest("#notify")){
    if (notifyOn && Notification.permission==="granted") notifyOn = false;
    else { const p = await Notification.requestPermission(); notifyOn = p==="granted"; if(!notifyOn) toast("The browser blocked notifications for this page"); }
    try{ localStorage.setItem("csb-notify", notifyOn?"1":"0"); }catch{}
    render(); return;
  }
  const tr = e.target.closest("tr[data-id]"); if (tr){ selected = tr.dataset.id === selected ? null : tr.dataset.id; render(); }
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const ids = ordered.map(([s])=>s.id), i = ids.indexOf(selected);
  if (e.key === "ArrowDown" || e.key === "j"){ selected = ids[Math.min(ids.length-1, i+1)] ?? null; render(); e.preventDefault(); }
  else if (e.key === "ArrowUp" || e.key === "k"){ selected = ids[Math.max(0, i<0?0:i-1)] ?? null; render(); e.preventDefault(); }
  else if (e.key === "Escape"){ selected = null; render(); }
  else if (e.key === "c") act("resume");
  else if (e.key === "f") act("folder");
  else if (e.key === "h") act("hide");
});
</script>
</body>
</html>
